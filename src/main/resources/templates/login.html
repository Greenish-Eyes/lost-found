<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <style>
        body   { font-family: Arial, sans-serif; margin: 24px; }
        h1     { color: green; }
        .ok    { color: green; }
        .error { color: #b00020; }
    </style>
</head>
<body>
<h1>Sign in</h1>

<p class="ok"    th:if="${param.registered}">Account created. Please sign in.</p>
<p class="error" th:if="${param.error}">Wrong username or password.</p>
<p class="ok"    th:if="${param.logout}">You have signed out.</p>

<form th:action="@{/login}" method="post">
    <p><input name="username" placeholder="Username" required></p>
    <p><input name="password" type="password" placeholder="Password" required></p>
    <button type="submit">Sign in</button>
</form>

<p>Don't have an account? <a th:href="@{/register}">Register</a></p>
</body>
</html>
